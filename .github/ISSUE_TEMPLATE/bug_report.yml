name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more precise you are about what happened, the faster it can be fixed.

  - type: input
    id: version
    attributes:
      label: VoxDrop version
      description: Visible in the menu-bar → Settings, or in the DMG filename
      placeholder: "0.9.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → "About This Mac"
      placeholder: "14.4 (Sonoma)"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: |
        I pressed FN + Control and spoke. The recording started, but after releasing, no text was inserted.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch VoxDrop
        2. Click into TextEdit
        3. Press and hold FN + Control
        4. Say "Hello world"
        5. Release
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Recording mode
      options:
        - Hold mode (press and hold)
        - Toggle mode (press → FN to stop)
        - Not sure
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: Screenshots, console logs, or anything else that might help
    validations:
      required: false
