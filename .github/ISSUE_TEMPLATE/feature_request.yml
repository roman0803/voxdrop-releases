name: Feature Request
description: Idea for a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe what you have in mind as concretely as possible.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you missing today, or what frustrates you in the current workflow?
      placeholder: |
        When dictating, I sometimes switch between German and English. Right now I need two different modes for that.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What could the solution look like?
      placeholder: |
        An "auto-detect" mode that picks the language itself, or a menu-bar button to toggle quickly.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: Mockups, links to similar apps, etc.
    validations:
      required: false
